[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for timestamps embedded in file names / revision comments
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc/.pyo files without a source .py file to be
# detected as revisions in the versions/ directory
sourceless = false

# Version location(s)
version_locations = %(here)s/alembic/versions

# Version path separator
version_path_separator = os

# Do not load the .env into this file directly — env.py reads
# DATABASE_URL from app.core.config.settings at runtime, so the
# connection string never has to be duplicated or hardcoded here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured (e.g. auto-formatting with black/ruff
# after `alembic revision --autogenerate`). Uncomment and adjust if
# your workflow wants one:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
